<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SATORU — Cursed Techniques · Hand Tracking</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    overflow: hidden;
    font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace;
    color: #fff;
  }
  #webcam { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #three { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #title {
    position: fixed; top: 20px; left: 120px;
    font-size: 13px; letter-spacing: 0.25em; color: #aaa;
    z-index: 10; pointer-events: none;
  }
  #techLabel {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 44px; letter-spacing: 0.35em;
    font-weight: 400;
    color: #fff;
    z-index: 9;
    pointer-events: none;
    text-shadow: 0 0 14px currentColor;
    opacity: 0;
    transition: opacity 0.25s ease, color 0.35s ease;
    text-align: center;
    white-space: nowrap;
  }
  #techSub {
    position: fixed; top: calc(50% + 46px); left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.5em;
    color: rgba(255,255,255,0.6);
    z-index: 9;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #hint {
    position: fixed; top: 20px; right: 30px;
    font-size: 10px; letter-spacing: 0.15em; color: #666;
    z-index: 10; pointer-events: none; text-align: right; line-height: 1.9;
  }
  #hint b { color: #ccc; font-weight: 400; }
  #debugLog {
    position: fixed; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.6); color: #0f0;
    padding: 6px 10px; border: 1px solid #333;
    font-size: 10px; white-space: pre; z-index: 200;
    max-width: 360px; line-height: 1.5;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: #fff; color: #000; border: none;
    padding: 20px 40px; font-size: 16px;
    font-family: monospace; letter-spacing: 0.2em;
    cursor: pointer; z-index: 150;
  }
  #menuLink {
    position: fixed; top: 14px; left: 14px;
    z-index: 250; font: 10px 'Courier New', monospace;
    letter-spacing: 0.2em; color: #aaa;
    text-decoration: none; border: 1px solid #444;
    padding: 6px 10px; background: rgba(0,0,0,0.5);
  }
  /* hand skeleton overlay */
  #handCanvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    z-index: 5; pointer-events: none;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
  <a href="index.html" id="menuLink">← MENU</a>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="three"></canvas>
  <canvas id="handCanvas"></canvas>
  <div id="title">SATORU · CURSED TECHNIQUES</div>
  <div id="techLabel"></div>
  <div id="techSub"></div>
  <div id="hint">
    <b>PINCH</b> · hollow purple<br/>
    <b>INDEX UP</b> · red<br/>
    <b>PEACE</b> · infinite void<br/>
    <b>OPEN PALM</b> · malevolent shrine
  </div>
  <div id="debugLog">booting...</div>
  <button id="startBtn">▶ START</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  // ===== Logging =====
  const dbg = document.getElementById("debugLog");
  const logs = [];
  function log(msg) {
    logs.push(msg);
    if (logs.length > 10) logs.shift();
    dbg.innerText = logs.join("\n");
    console.log("[v7]", msg);
  }
  window.addEventListener("error", (e) => log("ERR: " + e.message));
  window.addEventListener("unhandledrejection", (e) => log("PROMISE ERR: " + (e.reason?.message || e.reason)));

  // ===== State =====
  const state = {
    video: null,
    mpReady: false,
    hands: [],           // MediaPipe landmark arrays
    technique: "none",   // current technique: none | hollow | void | red | shrine
    techniqueConfidence: 0,
    shake: 0,
    palm: new THREE.Vector3(0, 0, 0),  // world-space hand position
    handActive: false,
  };

  // ===== Three.js scene =====
  const threeCanvas = document.getElementById("three");
  const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 0, 70);

  // ambient starfield (very faint) for depth
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(800 * 3);
  for (let i = 0; i < 800; i++) {
    starPos[i*3+0] = (Math.random() - 0.5) * 320;
    starPos[i*3+1] = (Math.random() - 0.5) * 200;
    starPos[i*3+2] = -80 - Math.random() * 200;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.35 });
  scene.add(new THREE.Points(starGeo, starMat));

  // ===== Main particle system (20,000 points) =====
  const N = 20000;
  const positions = new Float32Array(N * 3);
  const colors    = new Float32Array(N * 3);
  const sizes     = new Float32Array(N);
  // target buffers
  const targetPos   = new Float32Array(N * 3);
  const targetColor = new Float32Array(N * 3);
  const targetSize  = new Float32Array(N);

  // initial: inert sphere at origin, dim white
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const b = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.5) * 25;
    positions[i*3+0] = Math.cos(a) * Math.sin(b) * r;
    positions[i*3+1] = Math.cos(b) * r;
    positions[i*3+2] = Math.sin(a) * Math.sin(b) * r;
    colors[i*3+0] = 0.1; colors[i*3+1] = 0.1; colors[i*3+2] = 0.15;
    sizes[i] = 0.4;
  }
  const partGeo = new THREE.BufferGeometry();
  partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  partGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  // Build a soft circular sprite texture (radial alpha gradient)
  // so points render as soft glowing dots, not square blocks.
  function makeCircleSprite() {
    const size = 64;
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0.0, "rgba(255,255,255,1.0)");
    grad.addColorStop(0.3, "rgba(255,255,255,0.6)");
    grad.addColorStop(0.6, "rgba(255,255,255,0.15)");
    grad.addColorStop(1.0, "rgba(255,255,255,0.0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }
  const partMat = new THREE.PointsMaterial({
    size: 2.2,
    map: makeCircleSprite(),
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: false,  // pixel-size, predictable at any camera distance
  });
  const points = new THREE.Points(partGeo, partMat);
  scene.add(points);

  // ===== Post-processing: Bloom =====
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.8,   // strength (lerped per technique)
    0.6,   // radius
    0.55   // threshold — only bright cores bloom, not hazy halos
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ===== Technique definitions =====
  // Each technique populates targetPos/targetColor and has a bloom strength,
  // a rotation speed, a label, and an SFX profile.
  const TECHNIQUES = {
    none: {
      label: "",
      sub: "",
      bloom: 0.4,
      rotX: 0, rotY: 0.003, rotZ: 0,
      textColor: "#888",
      build(t, cx, cy, cz) {
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2 * 37;
          const b = (i / N) * Math.PI;
          const r = 14 + Math.sin(i * 0.13) * 4;
          targetPos[i*3+0] = cx + Math.cos(a) * Math.sin(b) * r * 0.2;
          targetPos[i*3+1] = cy + Math.cos(b) * r * 0.2;
          targetPos[i*3+2] = cz + Math.sin(a) * Math.sin(b) * r * 0.2;
          targetColor[i*3+0] = 0.08;
          targetColor[i*3+1] = 0.08;
          targetColor[i*3+2] = 0.12;
          targetSize[i] = 0.4;
        }
      }
    },

    // ───── HOLLOW PURPLE · pinch ─────
    hollow: {
      label: "HOLLOW PURPLE",
      sub: "무량공처",
      bloom: 1.6,
      rotX: 0, rotY: 0.05, rotZ: 0.2,
      textColor: "#c9a0ff",
      build(t, cx, cy, cz) {
        const R = 24;
        for (let i = 0; i < N; i++) {
          const a = Math.random() * Math.PI * 2;
          const b = Math.acos(2 * Math.random() - 1);
          let r;
          if (i % 4 === 0) {
            // 25% scattered outer shell
            r = R * (0.9 + Math.random() * 1.0);
          } else {
            // uniform volumetric sphere (cube-root of random for even density)
            r = Math.pow(Math.random(), 0.55) * R;
          }
          targetPos[i*3+0] = cx + Math.cos(a) * Math.sin(b) * r;
          targetPos[i*3+1] = cy + Math.cos(b) * r;
          targetPos[i*3+2] = cz + Math.sin(a) * Math.sin(b) * r * 0.8;
          // purple dominant, subtle core lift (avoid hot-white blowout)
          const coreLift = (r < 8) ? 1.15 : 0.85;
          targetColor[i*3+0] = 0.55 * coreLift;
          targetColor[i*3+1] = 0.35 * coreLift;
          targetColor[i*3+2] = 0.95 * coreLift;
          targetSize[i] = (i % 4 === 0) ? 1.2 : 2.0;
        }
      }
    },

    // ───── INFINITE VOID · peace (index + middle) ─────
    void: {
      label: "INFINITE VOID",
      sub: "무하공",
      bloom: 1.0,
      rotX: 0, rotY: 0.0, rotZ: 0,
      textColor: "#7fd8ff",
      build(t, cx, cy, cz) {
        const ringR = 26;
        for (let i = 0; i < N; i++) {
          if (i < N * 0.35) {
            // inner ring (flat disc, event horizon)
            const a = Math.random() * Math.PI * 2;
            const r = ringR + (Math.random() - 0.5) * 2.5;
            targetPos[i*3+0] = cx + Math.cos(a) * r;
            targetPos[i*3+1] = cy + Math.sin(a) * r;
            targetPos[i*3+2] = cz + (Math.random() - 0.5) * 0.8;
            targetColor[i*3+0] = 0.6; targetColor[i*3+1] = 0.85; targetColor[i*3+2] = 1.0;
            targetSize[i] = 2.5;
          } else {
            // outer diffuse shell (celestial background)
            const a = Math.random() * Math.PI * 2;
            const b = Math.acos(2 * Math.random() - 1);
            const r = 30 + Math.random() * 60;
            targetPos[i*3+0] = cx + Math.cos(a) * Math.sin(b) * r;
            targetPos[i*3+1] = cy + Math.cos(b) * r;
            targetPos[i*3+2] = cz + Math.sin(a) * Math.sin(b) * r;
            targetColor[i*3+0] = 0.1; targetColor[i*3+1] = 0.6; targetColor[i*3+2] = 1.0;
            targetSize[i] = 0.7;
          }
        }
      }
    },

    // ───── RED · index finger only ─────
    red: {
      label: "RED",
      sub: "적전 · 반전술식",
      bloom: 1.3,
      rotX: 0, rotY: 0, rotZ: -0.1,
      textColor: "#ff4a4a",
      build(t, cx, cy, cz) {
        const R = 22;
        for (let i = 0; i < N; i++) {
          if (i < N * 0.2) {
            // core sphere (hot white-red)
            const a = Math.random() * Math.PI * 2;
            const b = Math.acos(2 * Math.random() - 1);
            const r = Math.pow(Math.random(), 0.4) * 10;
            targetPos[i*3+0] = cx + Math.cos(a) * Math.sin(b) * r;
            targetPos[i*3+1] = cy + Math.cos(b) * r;
            targetPos[i*3+2] = cz + Math.sin(a) * Math.sin(b) * r;
            targetColor[i*3+0] = 1.2; targetColor[i*3+1] = 0.25; targetColor[i*3+2] = 0.15;
            targetSize[i] = 2.5;
          } else {
            // three-arm spiral reaching outward
            const arm = i % 3;
            const f = ((i - N * 0.2) / (N * 0.8));
            const a = f * Math.PI * 2 * 3 + (arm * Math.PI * 2 / 3);
            const r = 2 + f * 40;
            targetPos[i*3+0] = cx + Math.cos(a) * r;
            targetPos[i*3+1] = cy + Math.sin(a) * r;
            targetPos[i*3+2] = cz + (Math.random() - 0.5) * 6;
            targetColor[i*3+0] = 0.9; targetColor[i*3+1] = 0.05; targetColor[i*3+2] = 0.05;
            targetSize[i] = 1.0;
          }
        }
      }
    },

    // ───── MALEVOLENT SHRINE · open palm (all 5 fingers) ─────
    shrine: {
      label: "MALEVOLENT SHRINE",
      sub: "복마어주자",
      bloom: 1.1,
      rotX: 0, rotY: 0, rotZ: 0,  // orientation locked
      textColor: "#ff8080",
      build(t, cx, cy, cz) {
        for (let i = 0; i < N; i++) {
          const bucket = i / N;
          if (bucket < 0.30) {
            // Floor plane (30%)
            const u = (Math.random() - 0.5) * 60;
            const w = (Math.random() - 0.5) * 60;
            targetPos[i*3+0] = cx + u;
            targetPos[i*3+1] = cy - 15;
            targetPos[i*3+2] = cz + w;
            targetColor[i*3+0] = 0.4; targetColor[i*3+1] = 0.05; targetColor[i*3+2] = 0.05;
            targetSize[i] = 0.7;
          } else if (bucket < 0.40) {
            // Pillars (10%) - four corners
            const col = i % 4;
            const x0 = (col === 0 || col === 3) ? -22 : 22;
            const z0 = (col < 2) ? -22 : 22;
            const hy = Math.random() * 30 - 15;
            targetPos[i*3+0] = cx + x0 + (Math.random() - 0.5) * 2;
            targetPos[i*3+1] = cy + hy;
            targetPos[i*3+2] = cz + z0 + (Math.random() - 0.5) * 2;
            targetColor[i*3+0] = 0.2; targetColor[i*3+1] = 0.2; targetColor[i*3+2] = 0.2;
            targetSize[i] = 0.8;
          } else if (bucket < 0.70) {
            // Dome (30%) - upper hemisphere
            const a = Math.random() * Math.PI * 2;
            const b = Math.random() * (Math.PI * 0.5);  // only upper half
            const r = 28 + (Math.random() - 0.5) * 3;
            targetPos[i*3+0] = cx + Math.cos(a) * Math.sin(b + Math.PI * 0.5) * r;
            targetPos[i*3+1] = cy + 15 + Math.cos(b) * r * 0.5;
            targetPos[i*3+2] = cz + Math.sin(a) * Math.sin(b + Math.PI * 0.5) * r;
            targetColor[i*3+0] = 0.6; targetColor[i*3+1] = 0.1; targetColor[i*3+2] = 0.1;
            targetSize[i] = 0.8;
          } else {
            // Diffuse aura (30%) - drifting dust
            const a = Math.random() * Math.PI * 2;
            const r = 15 + Math.random() * 35;
            targetPos[i*3+0] = cx + Math.cos(a) * r;
            targetPos[i*3+1] = cy + (Math.random() - 0.5) * 30;
            targetPos[i*3+2] = cz + Math.sin(a) * r;
            targetColor[i*3+0] = 0.3; targetColor[i*3+1] = 0.05; targetColor[i*3+2] = 0.05;
            targetSize[i] = 0.4;
          }
        }
      }
    }
  };

  let currentTech = "none";
  TECHNIQUES.none.build(0, 0, 0, 0);

  // ===== Technique switcher =====
  const techLabelEl = document.getElementById("techLabel");
  const techSubEl   = document.getElementById("techSub");

  function setTechnique(name) {
    if (name === currentTech) return;
    currentTech = name;
    const T = TECHNIQUES[name];
    T.build(0, state.palm.x, state.palm.y, state.palm.z);
    // UI label
    if (name === "none") {
      techLabelEl.style.opacity = "0";
      techSubEl.style.opacity = "0";
    } else {
      techLabelEl.innerText = T.label;
      techLabelEl.style.color = T.textColor;
      techSubEl.innerText = T.sub;
      techLabelEl.style.opacity = "1";
      techSubEl.style.opacity = "1";
      // trigger shake + SFX
      state.shake = 0.5;
      playTechSfx(name);
    }
    log("technique → " + name);
  }

  // ===== Sound (Web Audio API) =====
  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTechSfx(name) {
    try {
      const ctx = ensureAudio();
      const now = ctx.currentTime;
      // each technique = distinct tone color
      const profiles = {
        hollow: { freqs: [80, 110, 880, 1320], type: "sawtooth", dur: 1.4, gain: 0.35 },
        void:   { freqs: [220, 330, 440], type: "sine", dur: 2.0, gain: 0.22 },
        red:    { freqs: [60, 90, 180, 240], type: "square", dur: 0.9, gain: 0.25 },
        shrine: { freqs: [40, 55, 65], type: "sawtooth", dur: 2.6, gain: 0.3 },
      };
      const p = profiles[name];
      if (!p) return;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(p.gain, now + 0.02);
      master.gain.exponentialRampToValueAtTime(0.0001, now + p.dur);
      master.connect(ctx.destination);
      p.freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        osc.type = p.type;
        osc.frequency.setValueAtTime(f, now);
        // slight pitch slide
        osc.frequency.exponentialRampToValueAtTime(f * 0.6, now + p.dur);
        const g = ctx.createGain();
        g.gain.value = 1 / p.freqs.length;
        osc.connect(g).connect(master);
        osc.start(now);
        osc.stop(now + p.dur + 0.05);
      });
      // noise burst for "pop"
      if (name === "hollow" || name === "red") {
        const buf = ctx.createBuffer(1, 4410, 44100);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const ng = ctx.createGain();
        ng.gain.value = 0.25;
        noise.connect(ng).connect(ctx.destination);
        noise.start(now);
      }
    } catch (e) { log("sfx err: " + e.message); }
  }

  // ===== MediaPipe =====
  async function startMediaPipe(video) {
    log("loading MediaPipe...");
    const mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const { HandLandmarker, FilesetResolver } = mod;
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 2
    });
    state.mpReady = true;
    log("MediaPipe READY");
    let lastTs = -1;
    function detect() {
      if (video.currentTime !== lastTs) {
        lastTs = video.currentTime;
        try {
          const hr = handLandmarker.detectForVideo(video, performance.now());
          state.hands = hr.landmarks || [];
        } catch (e) {}
      }
      requestAnimationFrame(detect);
    }
    detect();
  }

  // ===== Gesture detection =====
  // MediaPipe landmark indices:
  //   thumb:  1,2,3,4 (tip=4)
  //   index:  5,6,7,8 (tip=8)
  //   middle: 9,10,11,12 (tip=12)
  //   ring:   13,14,15,16 (tip=16)
  //   pinky:  17,18,19,20 (tip=20)
  function dist3(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z||0) - (b.z||0);
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
  // Is finger extended upward? compare tip.y vs PIP.y (y grows downward in image)
  function isExtended(lm, tip, pip) {
    return lm[tip].y < lm[pip].y - 0.02;
  }
  function isThumbExtended(lm) {
    // compare thumb tip to index MCP — thumb out to the side
    const tip = lm[4], ref = lm[5];
    const palm = lm[0];
    return dist3(tip, palm) > dist3(ref, palm) * 0.9;
  }

  function classify(lm) {
    if (!lm || lm.length < 21) return "none";
    // Pinch: thumb tip close to index tip
    const pinchD = dist3(lm[4], lm[8]);
    const idxExt = isExtended(lm, 8, 6);
    const midExt = isExtended(lm, 12, 10);
    const rngExt = isExtended(lm, 16, 14);
    const pkyExt = isExtended(lm, 20, 18);
    const thbExt = isThumbExtended(lm);

    if (pinchD < 0.06 && !midExt && !rngExt && !pkyExt) return "hollow";
    if (idxExt && midExt && rngExt && pkyExt && thbExt) return "shrine";
    if (idxExt && midExt && !rngExt && !pkyExt) return "void";
    if (idxExt && !midExt && !rngExt && !pkyExt) return "red";
    return "none";
  }

  // Get palm world position from hand landmark 9 (middle MCP)
  function palmToWorld(lm) {
    // lm coords: x,y in [0,1], z in world-ish units
    // mirror x (selfie) and remap to world
    const px = (1 - lm[9].x - 0.5) * 100; // -50..50
    const py = -(lm[9].y - 0.5) * 60;     // invert, -30..30
    const pz = -lm[9].z * 80;
    return { x: px, y: py, z: pz };
  }

  // ===== Hand skeleton overlay =====
  const handCanvas = document.getElementById("handCanvas");
  const hctx = handCanvas.getContext("2d");
  function resizeHandCanvas() {
    handCanvas.width = window.innerWidth * devicePixelRatio;
    handCanvas.height = window.innerHeight * devicePixelRatio;
    hctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resizeHandCanvas();
  const HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];
  function drawHands() {
    const W = window.innerWidth, H = window.innerHeight;
    hctx.clearRect(0, 0, W, H);
    if (!state.hands.length) return;
    const glow = TECHNIQUES[currentTech]?.textColor || "#ffffff";
    hctx.strokeStyle = glow;
    hctx.fillStyle = glow;
    hctx.shadowColor = glow;
    hctx.shadowBlur = 8;
    hctx.lineWidth = 1.5;
    for (const lm of state.hands) {
      // draw connections
      for (const [a, b] of HAND_CONNECTIONS) {
        const x1 = (1 - lm[a].x) * W, y1 = lm[a].y * H;
        const x2 = (1 - lm[b].x) * W, y2 = lm[b].y * H;
        hctx.beginPath();
        hctx.moveTo(x1, y1);
        hctx.lineTo(x2, y2);
        hctx.stroke();
      }
      // dots
      for (const p of lm) {
        const x = (1 - p.x) * W, y = p.y * H;
        hctx.beginPath();
        hctx.arc(x, y, 3, 0, Math.PI * 2);
        hctx.fill();
      }
    }
    hctx.shadowBlur = 0;
  }

  // ===== Technique debounce =====
  let pendingTech = "none";
  let pendingCount = 0;
  const CONFIRM_FRAMES = 6;  // ~0.1s

  function updateTechnique() {
    // pick first hand (primary) if available
    let gesture = "none";
    if (state.hands.length > 0) {
      gesture = classify(state.hands[0]);
      const w = palmToWorld(state.hands[0]);
      state.palm.set(w.x, w.y, w.z);
      state.handActive = true;
    } else {
      state.handActive = false;
    }
    if (gesture === pendingTech) {
      pendingCount++;
      if (pendingCount >= CONFIRM_FRAMES && gesture !== currentTech) {
        setTechnique(gesture);
      }
    } else {
      pendingTech = gesture;
      pendingCount = 1;
    }
  }

  // ===== Main render loop =====
  const clock = new THREE.Clock();
  const tmpRot = { x: 0, y: 0, z: 0 };

  function animate() {
    const dt = clock.getDelta();
    const t  = clock.getElapsedTime();
    updateTechnique();

    const T = TECHNIQUES[currentTech];
    // re-build targets only occasionally to keep animation cheap
    // (only rebuild when palm moves significantly or on technique change)
    // Here we just rebuild every frame with a time parameter for subtle drift.
    if (currentTech !== "none") {
      T.build(t, state.palm.x, state.palm.y, state.palm.z);
    } else {
      T.build(t, 0, 0, 0);
    }

    // Lerp position/color/size toward target (factor 0.1 per frame like SAT0RU)
    const posAttr = partGeo.attributes.position.array;
    const colAttr = partGeo.attributes.color.array;
    const lerpF = 0.08;
    for (let i = 0; i < N; i++) {
      posAttr[i*3+0] += (targetPos[i*3+0] - posAttr[i*3+0]) * lerpF;
      posAttr[i*3+1] += (targetPos[i*3+1] - posAttr[i*3+1]) * lerpF;
      posAttr[i*3+2] += (targetPos[i*3+2] - posAttr[i*3+2]) * lerpF;
      colAttr[i*3+0] += (targetColor[i*3+0] - colAttr[i*3+0]) * lerpF;
      colAttr[i*3+1] += (targetColor[i*3+1] - colAttr[i*3+1]) * lerpF;
      colAttr[i*3+2] += (targetColor[i*3+2] - colAttr[i*3+2]) * lerpF;
    }
    partGeo.attributes.position.needsUpdate = true;
    partGeo.attributes.color.needsUpdate = true;

    // Rotation
    if (currentTech === "shrine") {
      points.rotation.set(0, 0, 0);  // locked
    } else {
      points.rotation.x += T.rotX * dt * 60;
      points.rotation.y += T.rotY * dt * 60;
      points.rotation.z += T.rotZ * dt * 60;
    }

    // Bloom strength lerp
    bloom.strength += (T.bloom - bloom.strength) * 0.1;

    // Camera shake
    state.shake *= 0.9;
    const sh = state.shake;
    camera.position.x = (Math.random() - 0.5) * sh * 6;
    camera.position.y = (Math.random() - 0.5) * sh * 6;

    // Draw hand overlay
    drawHands();

    composer.render();
    requestAnimationFrame(animate);
  }

  // ===== Resize =====
  window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    composer.setSize(window.innerWidth, window.innerHeight);
    bloom.setSize(window.innerWidth, window.innerHeight);
    resizeHandCanvas();
  });

  // ===== Boot =====
  const btn = document.getElementById("startBtn");
  btn.addEventListener("click", async () => {
    btn.style.display = "none";
    log("requesting webcam...");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: "user" }, audio: false
      });
      state.video = document.getElementById("webcam");
      state.video.srcObject = stream;
      await state.video.play();
      log("webcam ready");
      ensureAudio();  // unlock audio on gesture
      await startMediaPipe(state.video);
      animate();
    } catch (e) {
      log("boot fail: " + e.message);
    }
  });
</script>
</body>
</html>
